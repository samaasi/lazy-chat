name: Build Cross-Platform Executables

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
          # macOS Intel
          - os: darwin
            arch: amd64
            runner: macos-latest
            ext: ''
          # macOS ARM (Apple Silicon)
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
          # Linux
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            ext: ''
          # Linux ARM64
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            ext: ''

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        check-latest: true

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Build executable
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        go build -v -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o lazy-chat-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd

    - name: Create release directory
      run: |
        mkdir -p release
        cp lazy-chat-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} release/
        cp config.example.json release/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lazy-chat-${{ matrix.os }}-${{ matrix.arch }}
        path: release/
        retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archives
      run: |
        cd artifacts
        for dir in */; do
          if [ -d "$dir" ]; then
            cd "$dir"
            if [[ "$dir" == *"windows"* ]]; then
              zip -r "../lazy-chat-${dir%/}.zip" .
            else
              tar -czf "../lazy-chat-${dir%/}.tar.gz" .
            fi
            cd ..
          fi
        done
        ls -la *.zip *.tar.gz

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/*.zip
          artifacts/*.tar.gz
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}